name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capital_markets
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/capital_markets
      DBT_TARGET: ci
      DBT_HOST: localhost
      DBT_USER: postgres
      DBT_PASSWORD: postgres

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt in its own environment
        run: |
          python -m venv .dbt-venv
          .dbt-venv/bin/pip install -r requirements-dbt.txt

      - name: Load the database
        run: python src/load_db.py

      - name: Build and test dbt models
        run: .dbt-venv/bin/dbt build --project-dir dbt --profiles-dir dbt

      - name: Run Python tests
        run: python -m pytest -v -rs
