name: capital_markets
version: "1.0.0"
config-version: 2
profile: capital_markets

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# How each layer is stored: views are cheap and always fresh, tables are fast to query
models:
  capital_markets:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
