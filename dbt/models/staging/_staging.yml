version: 2

models:
  - name: stg_dates
    description: Market calendar, one row per trading day.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]

  - name: stg_trades
    description: Cleaned trade book, one row per trade, with a numeric direction sign (+1 BUY, -1 SELL).
    columns:
      - name: trade_id
        data_tests: [unique, not_null]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: desk
        data_tests:
          - accepted_values:
              arguments:
                values: ['EQUITY', 'RATES', 'FX']
      - name: instrument_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['EQUITY_INDEX', 'BOND', 'FX_FORWARD']

  - name: stg_market_prices
    description: Market data in long format, one row per date and series.
    columns:
      - name: asset_class
        data_tests:
          - accepted_values:
              arguments:
                values: ['EQUITY', 'RATES', 'FX']
      - name: value
        data_tests: [not_null]

  - name: stg_valuations
    description: Daily mark-to-market of every trade, in USD.
    columns:
      - name: valuation_date
        data_tests: [not_null]
      - name: trade_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_trades')
                field: trade_id
      - name: trade_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['LIVE', 'MATURED']
