# Connection settings. No passwords are stored here: CI passes them as environment variables.
capital_markets:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:                                   # your laptop: local socket, peer authentication
      type: postgres
      host: /var/run/postgresql
      port: 5432
      user: "{{ env_var('USER') }}"
      password: ""
      dbname: capital_markets
      schema: analytics
      threads: 4
    ci:                                    # GitHub Actions: PostgreSQL service container
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: capital_markets
      schema: analytics
      threads: 4

    cloud:                                 # Neon: cloud PostgreSQL, credentials from .env
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      port: 5432
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "{{ env_var('NEON_DBNAME', 'neondb') }}"
      schema: analytics
      sslmode: require
      threads: 4
